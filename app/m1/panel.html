<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; font-src 'self' data:"><style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Microsoft YaHei",sans-serif;background:#111827;color:#e5e7eb;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;padding:12px 14px}
header{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px}
.badge{font-size:11px;font-weight:400;background:#1e3a8a;color:#bfdbfe;padding:2px 8px;border-radius:10px}
#status{font-size:12px;color:#9ca3af;margin:6px 0}
#mic{width:100%;padding:10px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#mic.rec{background:#dc2626}
textarea{width:100%;height:78px;resize:none;background:#0b1220;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:8px;font:15px "Microsoft YaHei",sans-serif;margin-top:8px}
.row{display:flex;gap:8px;margin-top:8px}
button.act{flex:1;padding:7px;border:0;border-radius:7px;background:#374151;color:#e5e7eb;cursor:pointer}
button.primary{background:#2563eb;color:#fff}
button.danger{background:#7f1d1d;color:#fecaca}
#answer{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:8px}
#text{flex:1;overflow:auto;white-space:pre-wrap;background:#0b1220;border:1px solid #1f2937;border-radius:8px;padding:10px;font-size:16px;line-height:1.65}
.katex-display{overflow-x:auto;overflow-y:hidden;margin:6px 0}
#thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#thumbs img{max-height:78px;max-width:48%;border-radius:6px;border:1px solid #374151}
#err{color:#fca5a5;font-size:12px;margin-top:6px;min-height:16px}
.hidden{display:none!important}
#hint{font-size:12px;color:#6b7280;margin-top:6px}
</style><link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<script src="../node_modules/katex/dist/katex.min.js"></script>
</head><body><div id="app">
<header><span>PPT-AI 课堂助手</span><span><button id="gear" style="border:0;background:#374151;color:#e5e7eb;border-radius:6px;padding:3px 8px;margin-right:6px;cursor:pointer">设置</button><span class="badge">云端 · deepseek-flash</span></span></header><div id="status">待机</div>
<button id="mic">按住说话（Ctrl+Alt+Space）</button>
<div id="hint">松手后先确认识别文本，再发送。Esc 取消。</div>

<div id="confirm" class="hidden">
  <div id="thumbs" class="hidden"></div>
  <textarea id="q" placeholder="识别结果，可修改…"></textarea>
  <div class="row">
    <button class="act primary" id="send">发送</button>
    <button class="act" id="again">重说</button>
    <button class="act hidden" id="skip">跳过直接问</button>
    <button class="act" id="cancel">取消</button>
  </div>
</div>

<div id="answer" class="hidden">
  <div id="text"></div>
  <div class="row">
    <button class="act danger" id="stop">停止</button>
    <button class="act" id="copy">复制</button>
    <button class="act" id="close">关闭</button>
  </div>
</div>

<div id="err"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const micBtn = $('mic'), q = $('q'), confirmBox = $('confirm'), answerBox = $('answer');
const textEl = $('text'), statusEl = $('status'), errEl = $('err');
let recording = false, mr = null, stream = null, chunks = [];
let raw = '', shown = 0, timer = null, doneFlag = false, active = false;
let mode = 'voice', pendingImages = [];
const thumbsEl = $('thumbs'), skipBtn = $('skip');

function setStatus(s){ statusEl.textContent = s; }
function setErr(s){ errEl.textContent = s || ''; }
function showConfirm(t){ q.value = t; confirmBox.classList.remove('hidden'); answerBox.classList.add('hidden'); micBtn.classList.remove('hidden'); skipBtn.classList.add('hidden'); thumbsEl.classList.add('hidden'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
function hideConfirm(){ confirmBox.classList.add('hidden'); }

function resetAnswer(){ raw=''; shown=0; doneFlag=false; active=true; mode='voice'; pendingImages=[]; thumbsEl.innerHTML=''; thumbsEl.classList.add('hidden'); skipBtn.classList.add('hidden'); textEl.innerHTML=''; answerBox.classList.remove('hidden'); confirmBox.classList.add('hidden'); micBtn.classList.add('hidden'); if(timer){clearInterval(timer);timer=null;} }
function escHtml(s){ return s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
function renderMath(s){
  const re = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\$([^$\n]+?)\$|\\\(([\s\S]+?)\\\)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    out += escHtml(s.slice(last, m.index));
    const tex = m[1] || m[2] || m[3] || m[4] || '';
    const display = !!(m[1] || m[2]);
    try { out += katex.renderToString(tex, { displayMode: display, throwOnError: false, strict: false }); }
    catch (e) { out += escHtml(m[0]); }
    last = m.index + m[0].length;
  }
  out += escHtml(s.slice(last));
  return out;
}
function tick(){
  if(shown < raw.length){ shown = Math.min(raw.length, shown + 2); textEl.innerHTML = renderMath(raw.slice(0, shown)); textEl.scrollTop = textEl.scrollHeight; }
  else if(doneFlag){ clearInterval(timer); timer=null; }
}
function pushDelta(t){ raw += t; if(!timer) timer = setInterval(tick, 28); }

async function toWav(blob){
  const ab = await blob.arrayBuffer();
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const audio = await ac.decodeAudioData(ab);
  const target = 16000;
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(audio.duration * target)), target);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const rendered = await off.startRendering();
  const samples = rendered.getChannelData(0);
  const len = samples.length;
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36 + len*2, true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,target,true); v.setUint32(28,target*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,len*2,true);
  let o = 44;
  for (let i = 0; i < len; i++) { let s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); o += 2; }
  return buf;
}
function b64(buf){ const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

async function startRec(){
  if (recording) return;
  setErr(''); setStatus('录音中…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) { setErr('麦克风不可用：' + e.message); setStatus('待机'); return; }
  chunks = [];
  mr = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    try {
      stream.getTracks().forEach(t => t.stop());
      setStatus('识别中…');
      const blob = new Blob(chunks, { type: 'audio/webm' });
      if (blob.size < 1000) { setErr('录音太短'); setStatus('待机'); return; }
      const wav = await toWav(blob);
      const pcm = new Int16Array(wav, 44);
      let sum = 0, peak = 0;
      for (let i = 0; i < pcm.length; i++) { const v = pcm[i]; sum += v * v; const a = Math.abs(v); if (a > peak) peak = a; }
      const rms = Math.sqrt(sum / Math.max(1, pcm.length));
      const dur = pcm.length / 16000;
      if (dur < 0.5 || rms < 200 || peak < 600) { setErr('没听清（音量太低或太短）'); setStatus('待机'); return; }
      const res = await window.m1.asr(b64(wav));
      if (!res.ok) { setErr(res.error || '识别失败'); setStatus('待机'); return; }
      if (!res.text) { setErr('没听清，请重说'); setStatus('待机'); return; }
      if (mode === 'lasso' && !confirmBox.classList.contains('hidden')) {
        q.value = (q.value + ' ' + res.text).trim();
        q.focus(); setStatus('已补充识别文本');
      } else {
        setStatus('请确认识别文本');
        showConfirm(res.text);
      }
      await window.m1.focusPanel();
    } catch (e) { setErr('识别异常：' + e.message); setStatus('待机'); }
  };
  mr.start();
  recording = true; micBtn.classList.add('rec');
}
function stopRec(){
  if (!recording) return;
  recording = false; micBtn.classList.remove('rec');
  try { mr.stop(); } catch (e) {}
}

micBtn.addEventListener('pointerdown', e => { e.preventDefault(); startRec(); });
micBtn.addEventListener('pointerup', e => { e.preventDefault(); stopRec(); });
micBtn.addEventListener('pointerleave', () => stopRec());

function send(){
  const t = q.value.trim();
  if (!t && pendingImages.length === 0) { setErr('问题为空'); return; }
  setErr(''); hideConfirm(); const imgs = pendingImages.slice(); resetAnswer(); setStatus('思考中…');
  window.m1.ask({ text: t, imageDataUrls: imgs });
}
$('send').onclick = send;
$('gear').onclick = () => window.m1.openSettings();
$('skip').onclick = () => { setErr(''); hideConfirm(); const imgs = pendingImages.slice(); resetAnswer(); setStatus('思考中…'); window.m1.ask({ text: '', imageDataUrls: imgs }); };
$('again').onclick = () => { hideConfirm(); startRec(); };
$('cancel').onclick = () => { hideConfirm(); mode='voice'; pendingImages=[]; thumbsEl.innerHTML=''; thumbsEl.classList.add('hidden'); skipBtn.classList.add('hidden'); setStatus('待机'); window.m1.focusShow(); };
$('stop').onclick = () => { window.m1.abort(); setStatus('已停止'); };
$('copy').onclick = () => navigator.clipboard.writeText(raw);
$('close').onclick = () => { answerBox.classList.add('hidden'); micBtn.classList.remove('hidden'); setStatus('待机'); window.m1.hidePanel(); window.m1.focusShow(); };
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideConfirm(); answerBox.classList.add('hidden'); micBtn.classList.remove('hidden'); setStatus('待机'); window.m1.focusShow(); } });

window.m1.onRec(v => { v ? startRec() : stopRec(); });
window.m1.onDelta(d => { setStatus('回答中…'); pushDelta(d.text); });
window.m1.onDone(d => { doneFlag = true; setStatus(d && d.aborted ? '已停止' : '完成'); tick(); });
window.m1.onError(msg => { setErr(msg); setStatus('出错'); active = false; });
window.m1.onState(s => { if (!s.showing) setStatus('未检测到放映'); });
window.m1.onLasso(d => {
  mode = 'lasso'; pendingImages = (d.imageDataUrls || []).slice(0, 5);
  setErr(''); setStatus('已圈选 ' + pendingImages.length + ' 个区域，补充问题或直接发送');
  thumbsEl.innerHTML = '';
  pendingImages.forEach(src => { const im = document.createElement('img'); im.src = src; thumbsEl.appendChild(im); });
  thumbsEl.classList.remove('hidden');
  confirmBox.classList.remove('hidden'); answerBox.classList.add('hidden'); micBtn.classList.remove('hidden');
  skipBtn.classList.remove('hidden');
  q.value = ''; q.placeholder = '可补充一句话；留空则直接问“讲解圈出内容”'; q.focus();
  if (d.areaRatio > 0.6) setErr('圈选范围较大，可能包含无关内容');
});
</script>
</body></html>
