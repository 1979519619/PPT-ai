<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; font-src 'self' data:"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;cursor:crosshair;user-select:none;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#bar{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:10;box-sizing:border-box;max-width:calc(100% - 24px);background:rgba(17,24,39,.96);color:#e5e7eb;font:15px "Microsoft YaHei",sans-serif;padding:10px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;cursor:default;touch-action:none}
#hint{flex:1 1 260px;line-height:1.5}
button{border:0;border-radius:8px;min-width:64px;min-height:48px;padding:9px 16px;background:#374151;color:#fff;cursor:pointer;font:16px "Microsoft YaHei",sans-serif;touch-action:manipulation}
button.p{background:#2563eb}button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}button:disabled{opacity:.45;cursor:default}
#cnt{color:#93c5fd;font-weight:700;white-space:nowrap}
</style></head><body>
<canvas id="bg"></canvas><canvas id="fg"></canvas>
<div id="bar" role="toolbar" aria-label="圈选操作">
  <span id="hint">画圈选取完整区域，松手后可继续，最多 5 区。Enter 完成 · Ctrl+Z 撤销 · Esc 取消</span>
  <span id="cnt">0 / 5 区</span>
  <button id="undo">撤销</button><button id="clear">清空</button>
  <button class="p" id="done">完成</button><button id="cancel">取消</button>
</div>
<script>
const MAX_LOOPS = 5;
const bg = document.getElementById('bg'), fg = document.getElementById('fg');
const bctx = bg.getContext('2d'), fctx = fg.getContext('2d');
const cntEl = document.getElementById('cnt'), hintEl = document.getElementById('hint');
let img = null, loops = [], cur = null, pointerId = null, mode = 'ask', completed = false, closing = false;
let expectedBounds = null, nativeCoverageOk = null, lastViewportKey = '', viewportVersion = 0, initVersion = 0, hintError = '';
const MAX_VIEWPORT_ATTEMPTS = 4, VIEWPORT_RETRY_MS = 160;
let viewportRetryTimer = null, viewportInFlight = null, viewportAttempts = 0;
let dpr = window.devicePixelRatio || 1;
function clientW(){ return document.documentElement.clientWidth || innerWidth; }
function clientH(){ return document.documentElement.clientHeight || innerHeight; }
function validExpected(value){return value && Number.isFinite(value.width) && Number.isFinite(value.height) && value.width>0 && value.height>0;}
function viewportReady(){
  return validExpected(expectedBounds) && Math.abs(clientW()-expectedBounds.width)<=2 &&
    Math.abs(clientH()-expectedBounds.height)<=2 && nativeCoverageOk===true;
}
function baseHint(){
  return mode==='place'?'拖出回答放置区域，松手后点完成。Enter 完成 · Esc 取消':
    mode==='translate'?'圈选要翻译的完整文字区域，最多 5 区。Enter 完成 · Ctrl+Z 撤销 · Esc 取消':
      '画圈选取完整区域，松手后可继续，最多 5 区。Enter 完成 · Ctrl+Z 撤销 · Esc 取消';
}
function updateHint(){
  hintEl.textContent=!viewportReady()?(hintError || (nativeCoverageOk===false?'屏幕覆盖核对未通过，暂不能完成。请按 Esc 取消，并记录本页完整截图。':'屏幕范围正在调整，暂不能完成圈选。请稍候，或按 Esc 取消。')):
    completed&&!closing?'正在确认选区，请稍候。按 Esc 可取消。':hintError||baseHint();
}
function clearViewportRetry(){clearTimeout(viewportRetryTimer);viewportRetryTimer=null;}
function retryViewport(version,initialization){
  if(closing || initialization!==initVersion || version!==viewportVersion || viewportReady())return;
  clearViewportRetry();
  if(viewportAttempts>=MAX_VIEWPORT_ATTEMPTS){
    hintError='屏幕范围核对仍未通过，请按 Esc 取消后重新打开，并记录本页完整截图。';redraw();return;
  }
  viewportRetryTimer=setTimeout(()=>{
    viewportRetryTimer=null;
    if(!closing && initialization===initVersion && version===viewportVersion)reportViewport();
  },VIEWPORT_RETRY_MS);
}
function reportViewport(){
  if(closing || !img || !img.naturalWidth || !img.naturalHeight)return;
  const value={width:clientW(),height:clientH(),dpr:window.devicePixelRatio||1,sourceWidth:img.naturalWidth,sourceHeight:img.naturalHeight};
  const key=JSON.stringify(value);
  if(key!==lastViewportKey){
    clearViewportRetry();lastViewportKey=key;nativeCoverageOk=null;hintError='';viewportAttempts=0;viewportVersion++;
  }else if(viewportReady())return;
  if(viewportInFlight)return;
  if(viewportAttempts>=MAX_VIEWPORT_ATTEMPTS){retryViewport(viewportVersion,initVersion);return;}
  clearViewportRetry();
  const version=viewportVersion, initialization=initVersion;
  if(typeof window.m1.lassoViewport!=='function'){
    nativeCoverageOk=false;hintError='屏幕范围检查尚不可用，请取消后重新打开。';redraw();return;
  }
  const flight={version,initialization};viewportInFlight=flight;viewportAttempts++;
  try{
    Promise.resolve(window.m1.lassoViewport(value)).then(result=>{
      if(closing || initialization!==initVersion || version!==viewportVersion)return;
      if(validExpected(result?.expectedBounds))expectedBounds={width:result.expectedBounds.width,height:result.expectedBounds.height};
      nativeCoverageOk=result?.coverageOk===true;
      if(result?.error)hintError=String(result.error).slice(0,200);
      else if(!viewportReady())hintError='屏幕范围尚未就绪，正在重试；也可按 Esc 取消。';
      if(viewportReady()){hintError='';clearViewportRetry();}else retryViewport(version,initialization);
      redraw();
    }).catch(()=>{
      if(closing || initialization!==initVersion || version!==viewportVersion)return;
      nativeCoverageOk=false;hintError='屏幕范围检查未完成，正在重试；也可按 Esc 取消。';retryViewport(version,initialization);redraw();
    }).finally(()=>{
      if(viewportInFlight===flight){
        viewportInFlight=null;
        if(!closing && (initialization!==initVersion || version!==viewportVersion))reportViewport();
      }
    });
  }catch(_){
    if(viewportInFlight===flight)viewportInFlight=null;
    if(closing || initialization!==initVersion || version!==viewportVersion)return;
    nativeCoverageOk=false;hintError='屏幕范围检查未完成，正在重试；也可按 Esc 取消。';retryViewport(version,initialization);redraw();
  }
}
function toSource(e){
  const rect=fg.getBoundingClientRect();
  return {x:Math.max(0,Math.min(img.naturalWidth,(e.clientX-rect.left)*img.naturalWidth/rect.width)),
    y:Math.max(0,Math.min(img.naturalHeight,(e.clientY-rect.top)*img.naturalHeight/rect.height))};
}
function toView(p){return {x:p.x*clientW()/img.naturalWidth,y:p.y*clientH()/img.naturalHeight};}
function sizeCanvas(){
  const cw=clientW(),ch=clientH();
  if(cw<=0 || ch<=0)return;
  dpr=window.devicePixelRatio||1;
  for(const c of [bg,fg]){c.width=Math.round(cw*dpr);c.height=Math.round(ch*dpr);}
  // DPR only sizes the backing stores. Pointer/source mapping uses each CSS axis.
  bctx.setTransform(bg.width/cw,0,0,bg.height/ch,0,0);fctx.setTransform(fg.width/cw,0,0,fg.height/ch,0,0);
  bctx.fillStyle='#000';bctx.fillRect(0,0,cw,ch);
  if(img && img.naturalWidth){
    bctx.drawImage(img,0,0,cw,ch);
  }
  reportViewport();
  redraw();
}
function drawLoop(pts,closed){
  if(pts.length<2)return;
  const first=toView(pts[0]);fctx.beginPath();fctx.moveTo(first.x,first.y);
  for(let i=1;i<pts.length;i++){const p=toView(pts[i]);fctx.lineTo(p.x,p.y);}
  if(closed){fctx.closePath();fctx.fill();}fctx.stroke();
}
function redraw(){
  fctx.clearRect(0,0,clientW(),clientH());
  fctx.lineWidth=3;fctx.strokeStyle='#2563eb';fctx.fillStyle='rgba(37,99,235,.12)';
  for(const loop of loops)drawLoop(loop,true);
  if(cur && cur.length>1)drawLoop(cur,mode==='place');
  cntEl.textContent=loops.length+' / '+(mode==='place'?1:MAX_LOOPS)+' 区';
  document.getElementById('done').disabled=completed||closing||loops.length===0||!viewportReady();
  updateHint();
}
function bounds(pts){
  if(!img||!pts||pts.length<2)return null;
  let minX=img.naturalWidth,minY=img.naturalHeight,maxX=0,maxY=0;
  for(const p of pts){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);}
  const x=Math.max(0,Math.floor(minX)),y=Math.max(0,Math.floor(minY));
  const right=Math.min(img.naturalWidth,Math.ceil(maxX)),bottom=Math.min(img.naturalHeight,Math.ceil(maxY));
  return right-x>=8 && bottom-y>=8?{x,y,w:right-x,h:bottom-y}:null;
}
function rectangle(a,b){return [a,{x:b.x,y:a.y},b,{x:a.x,y:b.y}];}
function finishPointer(commit,e){
  if(pointerId===null || (e && e.pointerId!==pointerId))return;
  const id=pointerId;pointerId=null;
  if(commit && e && cur){
    const point=toSource(e);
    if(mode==='place')cur=rectangle(cur[0],point);else cur.push(point);
  }
  if(commit && cur && bounds(cur) && loops.length<(mode==='place'?1:MAX_LOOPS))loops.push(cur);
  cur=null;
  if(fg.hasPointerCapture(id))fg.releasePointerCapture(id);
  redraw();
}
fg.addEventListener('pointerdown',e=>{
  if(completed || closing || !img || !img.naturalWidth || pointerId!==null || !e.isPrimary || e.button!==0 || loops.length>=(mode==='place'?1:MAX_LOOPS))return;
  const rect=fg.getBoundingClientRect();
  if(rect.width<=0||rect.height<=0||e.clientX<rect.left||e.clientY<rect.top||e.clientX>rect.right||e.clientY>rect.bottom)return;
  hintError='';
  e.preventDefault();pointerId=e.pointerId;cur=[toSource(e)];
  try{fg.setPointerCapture(e.pointerId);}catch(_){pointerId=null;cur=null;}
});
fg.addEventListener('pointermove',e=>{
  if(pointerId!==e.pointerId || !cur)return;
  e.preventDefault();const point=toSource(e);
  if(mode==='place')cur=rectangle(cur[0],point);
  else{const previous=toView(cur[cur.length-1]),next=toView(point);if(Math.hypot(next.x-previous.x,next.y-previous.y)<3)return;cur.push(point);}
  redraw();
});
fg.addEventListener('pointerup',e=>{e.preventDefault();finishPointer(true,e);});
fg.addEventListener('pointercancel',e=>finishPointer(false,e));
fg.addEventListener('lostpointercapture',e=>finishPointer(false,e));
window.addEventListener('blur',()=>finishPointer(false));
function undo(){if(completed||closing)return;hintError='';finishPointer(false);loops.pop();redraw();}
function clear(){if(completed||closing)return;hintError='';finishPointer(false);loops=[];redraw();}
function cancel(){
  if(closing)return;closing=true;completed=true;clearViewportRetry();viewportVersion++;finishPointer(false);
  try{
    Promise.resolve(window.m1.lassoCancel()).then(result=>{
      if(result?.ok===false){closing=false;completed=false;hintError=String(result.error||'取消未完成，请重试。').slice(0,200);redraw();}
    }).catch(()=>{closing=false;completed=false;hintError='取消未完成，请再按 Esc。';redraw();});
  }catch(_){closing=false;completed=false;hintError='取消未完成，请再按 Esc。';redraw();}
}
document.getElementById('undo').onclick=undo;
document.getElementById('clear').onclick=clear;
document.getElementById('cancel').onclick=cancel;
document.getElementById('done').onclick=complete;
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();finishPointer(true);complete();}
  else if(e.key==='Escape'){e.preventDefault();cancel();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
  else if(e.key.toLowerCase()==='c'){e.preventDefault();clear();}
});
function cropLoop(loop){
  const bbox=bounds(loop);if(!bbox)return null;
  const scale=Math.min(1,1600/Math.max(bbox.w,bbox.h));
  const crop=document.createElement('canvas');
  crop.width=Math.max(1,Math.round(bbox.w*scale));crop.height=Math.max(1,Math.round(bbox.h*scale));
  const ctx=crop.getContext('2d');ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,bbox.x,bbox.y,bbox.w,bbox.h,0,0,crop.width,crop.height);
  return {dataUrl:crop.toDataURL('image/png'),bbox};
}
async function complete(){
  if(completed||closing)return;
  if(!viewportReady()){updateHint();return;}
  if(!img || !img.naturalWidth || !loops.length){hintError='请先圈选至少一个区域。';redraw();return;}
  const sourceWidth=img.naturalWidth,sourceHeight=img.naturalHeight;
  const viewportWidth=clientW(),viewportHeight=clientH(),initialization=initVersion;
  let payload;
  if(mode==='place'){
    const bbox=bounds(loops[0]);if(!bbox){hintError='选区太小，请重新框选。';redraw();return;}
    payload={images:[],bbox,areaRatio:bbox.w*bbox.h/(sourceWidth*sourceHeight),sourceWidth,sourceHeight,viewportWidth,viewportHeight,mode};
  }else{
    const images=loops.slice(0,MAX_LOOPS).map(cropLoop).filter(Boolean);
    if(!images.length){hintError='选区太小，请重新圈选。';redraw();return;}
    const areaRatio=Math.max(...images.map(image=>image.bbox.w*image.bbox.h/(sourceWidth*sourceHeight)));
    payload={images,areaRatio,sourceWidth,sourceHeight,viewportWidth,viewportHeight,mode};
  }
  completed=true;redraw();
  try{
    const result=await window.m1.lassoDone(payload);
    if(closing || initialization!==initVersion)return;
    if(result===true || result?.ok===true){closing=true;return;}
    completed=false;hintError=String(result?.error||'选区尚未确认，请重试或按 Esc 取消。').slice(0,200);redraw();
  }catch(_){
    if(closing || initialization!==initVersion)return;
    completed=false;hintError='选区未能提交，已保留圈选。请重试或按 Esc 取消。';redraw();
  }
}
window.m1.onLassoInit(({dataUrl,mode:requestedMode,expectedBounds:expected}={})=>{
  clearViewportRetry();viewportAttempts=0;
  finishPointer(false);loops=[];completed=false;closing=false;hintError='';initVersion++;
  expectedBounds=validExpected(expected)?{width:expected.width,height:expected.height}:null;
  nativeCoverageOk=null;lastViewportKey='';viewportVersion++;
  mode=['ask','translate','place'].includes(requestedMode)?requestedMode:'ask';
  updateHint();
  const next=new Image();img=next;
  next.onload=()=>{if(img===next)sizeCanvas();};
  next.onerror=()=>{if(img===next)cancel();};
  if(typeof dataUrl!=='string'){cancel();return;}next.src=dataUrl;
});
window.addEventListener('resize',()=>{finishPointer(false);sizeCanvas();});
function stopViewportReporting(){closing=true;clearViewportRetry();viewportVersion++;}
window.addEventListener('pagehide',stopViewportReporting);
window.addEventListener('beforeunload',stopViewportReporting);
</script></body></html>
