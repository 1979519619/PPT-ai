name: Build unsigned Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      npm_config_cache: ${{ github.workspace }}\.cache\npm
      electron_config_cache: ${{ github.workspace }}\.cache\electron
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare fixed ASR resources
        shell: pwsh
        run: ./scripts/download-asr.ps1
      - name: Prepare fixed local OCR resources
        shell: pwsh
        run: ./scripts/prepare-ocr-runtime.ps1 -AllowCiWorkspace
      - name: Install locked dependencies
        working-directory: app
        run: npm ci
      - name: Install Electron runtime explicitly
        working-directory: app
        run: node node_modules/electron/install.js
      - name: Regression checks
        working-directory: app
        run: npm test
      - name: Collect dependency license notices
        run: node scripts/sync-licenses.cjs
      - name: Build unsigned NSIS installer
        working-directory: app
        run: npm run dist -- --publish never
      - name: Generate checksums
        shell: pwsh
        run: ./scripts/checksums.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PPT-AI-0.4.0-internal.6-windows-x64-unsigned
          path: |
            app/dist/PPT-AI-Setup-*.exe
            app/dist/SHA256SUMS
          if-no-files-found: error
